<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EXIF計測（GPS/撮影日時の残存率）</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 18px; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    line-height: 1.6; max-width: 760px; margin-inline: auto; }
  h1 { font-size: 19px; margin: 0 0 6px; }
  p.lead { color: #666; font-size: 14px; margin: 0 0 16px; }
  .pick { display: inline-flex; align-items: center; gap: 8px; padding: 14px 18px; border-radius: 12px;
    background: #b76e64; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; border: none; }
  .pick input { display: none; }
  #summary { margin: 18px 0; padding: 14px 16px; border-radius: 12px; background: rgba(127,127,127,.12);
    font-size: 15px; display: none; }
  #summary.show { display: block; }
  #summary b { font-size: 22px; }
  .bar { height: 10px; border-radius: 6px; background: rgba(127,127,127,.25); overflow: hidden; margin: 4px 0 12px; }
  .bar > span { display: block; height: 100%; background: #4a9; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid rgba(127,127,127,.25); vertical-align: top; }
  th { font-size: 12px; color: #888; font-weight: 600; }
  .ok { color: #2a8a5a; font-weight: 700; }
  .no { color: #c0453c; font-weight: 700; }
  .fn { word-break: break-all; color: #888; font-size: 12px; }
  .note { font-size: 12px; color: #888; margin-top: 18px; }
  #err { color: #c0453c; font-size: 14px; margin: 12px 0; display: none; }
</style>
</head>
<body>
  <h1>EXIF計測ツール（使い捨て）</h1>
  <p class="lead">写真を選ぶと、各写真に <b>位置情報(GPS)</b> と <b>撮影日時</b> が残っているかを集計します。
  写真は<b>端末内で読むだけ</b>で、どこにも送信しません。普段アップロードするのと同じ選び方で、実際の写真を20〜30枚選んでください。</p>

  <label class="pick">
    写真を選ぶ（複数可）
    <input id="file" type="file" accept="image/*" multiple>
  </label>

  <div id="err"></div>
  <div id="summary"></div>
  <table id="table" hidden>
    <thead><tr><th>#</th><th>GPS</th><th>撮影日時</th><th>座標 / 日時</th><th>ファイル</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>

  <p class="note">※ このページはアプリ本体とは無関係の下調べ用です。計測が済んだら削除して構いません。<br>
  ※ iOSは共有時に位置情報を外すことがあり、その場合「GPSなし」と出ます（それがまさに知りたい数字です）。</p>

<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let total = 0, withGps = 0, withDate = 0;

  function pad(n) { return String(n).padStart(2, '0'); }
  function fmtDate(d) {
    if (!d || !(d instanceof Date) || isNaN(d)) return '';
    return `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function renderSummary() {
    const g = total ? Math.round((withGps / total) * 100) : 0;
    const t = total ? Math.round((withDate / total) * 100) : 0;
    $('summary').className = 'show';
    $('summary').innerHTML =
      `<div>GPSあり：<b>${withGps}/${total}</b>（${g}%）</div><div class="bar"><span style="width:${g}%"></span></div>`
      + `<div>撮影日時あり：<b>${withDate}/${total}</b>（${t}%）</div><div class="bar"><span style="width:${t}%;background:#69c"></span></div>`;
  }

  async function handleFiles(files) {
    if (!window.exifr) { $('err').style.display = 'block'; $('err').textContent = 'EXIF解析ライブラリを読み込めませんでした。通信環境を確認して再読み込みしてください。'; return; }
    $('table').hidden = false;
    for (const file of files) {
      total++;
      let gps = null, date = null;
      try { gps = await exifr.gps(file); } catch (_) {}
      try { const m = await exifr.parse(file, ['DateTimeOriginal', 'CreateDate', 'ModifyDate']);
        date = (m && (m.DateTimeOriginal || m.CreateDate || m.ModifyDate)) || null; } catch (_) {}
      const hasGps = !!(gps && typeof gps.latitude === 'number' && typeof gps.longitude === 'number');
      const hasDate = !!date;
      if (hasGps) withGps++;
      if (hasDate) withDate++;
      const coord = hasGps ? `${gps.latitude.toFixed(5)}, ${gps.longitude.toFixed(5)}` : '';
      const dstr = hasDate ? fmtDate(new Date(date)) : '';
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${total}</td>`
        + `<td class="${hasGps ? 'ok' : 'no'}">${hasGps ? 'あり' : 'なし'}</td>`
        + `<td class="${hasDate ? 'ok' : 'no'}">${hasDate ? 'あり' : 'なし'}</td>`
        + `<td>${coord}${coord && dstr ? '<br>' : ''}${dstr}</td>`
        + `<td class="fn">${file.name.replace(/[&<>]/g, '')}</td>`;
      $('rows').appendChild(tr);
      renderSummary();
    }
  }

  $('file').addEventListener('change', (e) => {
    const files = Array.from(e.target.files || []);
    if (files.length) handleFiles(files);
    e.target.value = '';
  });
</script>
</body>
</html>
