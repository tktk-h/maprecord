<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>デート記録</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#b5675f">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="デート記録">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="gate" hidden>
    <div class="gate-card">
      <h1 class="gate-title">デート記録</h1>
      <div id="gate-login" hidden>
        <p class="gate-lead">二人の思い出を地図に残そう</p>
        <button id="gate-google" class="gate-btn primary"><i class="ph ph-google-logo"></i>Googleでログイン</button>
      </div>
      <div id="gate-space" hidden>
        <p class="gate-lead">スペースを作るか、招待コードで参加してください</p>
        <button id="gate-create" class="gate-btn primary">新しくスペースを作る</button>
        <div class="gate-or">または</div>
        <div class="gate-join">
          <input id="gate-code" type="text" placeholder="招待コード（例 ABCD-2345）">
          <button id="gate-join-btn" class="gate-btn">参加する</button>
        </div>
        <p id="gate-msg" class="gate-msg"></p>
      </div>
      <div id="gate-invite" hidden>
        <p class="gate-lead">スペースを作成しました。相手にこのコードを渡してください：</p>
        <div id="gate-invite-code" class="gate-code"></div>
        <button id="gate-start" class="gate-btn primary">はじめる</button>
      </div>
    </div>
  </div>

  <header id="topbar">
    <div id="view-toggle">
      <button id="view-map" class="active"><i class="ph ph-map-trifold"></i><span>地図</span></button>
      <button id="view-calendar"><i class="ph ph-calendar-blank"></i><span>カレンダー</span></button>
    </div>
    <div id="search-wrap">
      <i class="ph ph-magnifying-glass"></i>
      <input id="search-box" type="search" placeholder="場所名・#タグ で検索">
    </div>
    <button id="filter-toggle" title="絞り込み"><i class="ph ph-funnel"></i><span>絞り込み</span></button>
    <div id="filter-panel">
    <div id="filter-bar">
      <select id="mode-select">
        <option value="all">全部</option>
        <option value="day">特定の日</option>
        <option value="range">期間</option>
      </select>
      <input type="date" id="day-input" hidden>
      <span id="range-inputs" hidden>
        <input type="date" id="from-input"> 〜 <input type="date" id="to-input">
      </span>
      <span id="genre-filters"><!-- チェックボックスをJSで生成 --></span>
      <button id="filter-clear" title="絞り込みをリセット"><i class="ph ph-x"></i>クリア</button>
    </div>
    <div id="backup-bar">
      <button id="export-btn"><i class="ph ph-download-simple"></i><span>書き出し</span></button>
      <label id="import-label"><i class="ph ph-upload-simple"></i><span>読み込み</span><input type="file" id="import-input" accept="application/json" hidden></label>
      <button id="show-invite-btn"><i class="ph ph-user-plus"></i><span>招待コード</span></button>
      <button id="logout-btn"><i class="ph ph-sign-out"></i><span>ログアウト</span></button>
    </div>
    </div>
  </header>

  <main id="layout">
    <div id="map"></div>
    <button id="locate-btn" title="現在地で記録を追加"><i class="ph ph-crosshair"></i><span>現在地</span></button>
    <aside id="panel">
      <div id="sheet-grip"><span class="sheet-handle"></span></div>
      <div id="panel-content"><p class="hint">地図をクリックして記録を追加</p></div>
    </aside>
    <div id="calendar-view" hidden></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="js/genres.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/map.js"></script>
  <script src="js/records.js"></script>
  <script src="js/lightbox.js"></script>
  <script src="js/sheet.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/backup.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
