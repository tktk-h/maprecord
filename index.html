<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover は付けない。この iOS のホーム画面アプリでは、cover を付けた瞬間に
       窓が「画面の高さ−ステータスバー」のまま上へ移動し、上で得たぶんだけ下を失う
       （実測 2026-08-27: inner 797 / screen 844）。ステータスバーの指定を default に
       戻しても同じだったので、原因は cover 側。詳細は
       docs/superpowers/specs/2026-08-27-status-bar-map-design.md -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>あしあと</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#b5675f">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20260903g">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="あしあと">
  <!-- ステータスバーの下まで地図を敷けるのは black-translucent のときだけだが、
       この iOS では上と引き換えに下を同じだけ失うため使わない（上記参照）。 -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
  <link rel="stylesheet" href="style.css?v=20260903g">

  <script>
    (g=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.${c}apis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})({
      key: "AIzaSyC0686dd3grl_KMmLDwTAx1UHomoLgMhDo",
      v: "weekly",
    });
  </script>
  <!-- 起動を止めないため defer。exifr（写真のEXIF）は写真を選んだときに bulk.js が読む。 -->
  <script defer src="https://cdn.jsdelivr.net/npm/@googlemaps/markerclusterer@2.6.2/dist/index.min.js"></script>
</head>
<body>
  <div id="splash">
    <div class="splash-inner">
      <img class="splash-logo" src="icon-512.png?v=20260903g" alt="あしあと">
      <h1 class="splash-title">あしあと</h1>
      <p class="splash-tag">あなたの足あとを、地図に。</p>
      <div class="splash-spinner"></div>
    </div>
  </div>

  <div id="gate" hidden>
    <div class="gate-card">
      <img class="gate-logo" src="icon-512.png?v=20260903g" alt="あしあと">
      <h1 class="gate-title">あしあと</h1>
      <div id="gate-login" hidden>
        <p class="gate-lead">行った場所を残して、いつでもたどれる</p>
        <button id="gate-google" class="gate-btn google"><i class="ph ph-google-logo"></i>Googleでログイン</button>
        <p class="gate-note">ログインすると、二人だけのスペースで記録を共有できます</p>
      </div>
      <div id="gate-space" hidden>
        <p class="gate-lead">スペースを作るか、招待コードで参加してください</p>
        <button id="gate-create" class="gate-btn primary">新しくスペースを作る</button>
        <div class="gate-or">または</div>
        <div class="gate-join">
          <input id="gate-code" type="text" placeholder="招待コード（例 ABCD-2345）">
          <button id="gate-join-btn" class="gate-btn">参加する</button>
        </div>
        <p id="gate-msg" class="gate-msg"></p>
      </div>
      <div id="gate-invite" hidden>
        <p class="gate-lead">スペースを作成しました。相手にこのコードを渡してください：</p>
        <div id="gate-invite-code" class="gate-code"></div>
        <button id="gate-start" class="gate-btn primary">はじめる</button>
      </div>
      <div id="gate-offline" hidden>
        <p class="gate-lead">オフラインです</p>
        <p class="gate-note">接続すると、これまでの記録が表示されます。</p>
        <button id="gate-retry" class="gate-btn primary">再読み込み</button>
      </div>
    </div>
  </div>

  <header id="topbar">
    <div id="view-toggle">
      <span id="vt-thumb"></span><!-- 選ばれているほうへ滑る下地。位置と幅は js/app.js が測って決める -->
      <button id="view-map" class="active"><i class="ph ph-map-trifold"></i><span>地図</span></button>
      <button id="view-calendar"><i class="ph ph-calendar-blank"></i><span>カレンダー</span></button>
    </div>
    <button id="filter-clear-top" type="button" hidden aria-label="絞り込みをリセット"><i class="ph ph-x"></i></button>
    <div id="search-wrap">
      <i class="ph ph-magnifying-glass"></i>
      <input id="search-box" type="search" placeholder="場所名・#タグ で検索" autocomplete="off">
      <button id="search-clear" type="button" hidden aria-label="検索をクリア"><i class="ph ph-x"></i></button>
      <span class="search-div"></span>
      <button id="filter-toggle" type="button" title="絞り込み" aria-label="絞り込み"><i class="ph ph-sliders-horizontal"></i></button>
      <button id="settings-toggle" type="button" title="設定" aria-label="設定"><i class="ph ph-gear-six"></i></button>
      <div id="search-suggest" hidden></div>
    </div>
    <div id="filter-panel" hidden>
      <div class="filter-title"><i class="ph ph-sliders-horizontal"></i>絞り込み</div>
      <div id="filter-bar">
        <select id="mode-select">
          <option value="all">全部</option>
          <option value="day">特定の日</option>
          <option value="range">期間</option>
        </select>
        <div id="mode-segment"><!-- セグメントをJSで生成 --></div>
        <input type="date" id="day-input" hidden>
        <span id="range-inputs" hidden>
          <div id="range-cal"><!-- カレンダーをJSで生成（ふりかえりと共通） --></div>
          <input type="hidden" id="from-input">
          <input type="hidden" id="to-input">
        </span>
        <div class="gf-label">ジャンル</div>
        <span id="genre-filters"><!-- チップをJSで生成 --></span>
        <button id="filter-clear" title="絞り込みをリセット"><i class="ph ph-arrow-counter-clockwise"></i>リセット</button>
      </div>
    </div>
  </header>

  <main id="layout">
    <div id="map"></div>
    <div id="map-loading" hidden><span class="ml-spinner"></span>読み込み中…</div>
    <button id="locate-btn" title="現在地で記録を追加"><i class="ph ph-crosshair"></i><span>現在地</span></button>
    <button id="bulk-btn" title="写真からまとめて追加"><i class="ph ph-images"></i><span>まとめて</span></button>
    <button id="research-btn" hidden><i class="ph ph-arrows-clockwise"></i>このエリアを再検索</button>
    <div id="review-back" hidden><button class="rb-open"><i class="ph ph-arrow-u-up-left"></i>ふりかえりに戻る</button><button class="rb-x" aria-label="閉じる"><i class="ph ph-x"></i></button></div>
    <div id="memory-card" hidden></div>
    <aside id="panel" hidden>
      <button id="sheet-close" class="x-btn" aria-label="閉じる"><i class="ph ph-x"></i></button>
      <div id="sheet-grip"><span class="sheet-handle"></span></div>
      <div id="panel-content"><p class="hint">地図を長押しして記録を追加</p></div>
    </aside>
    <div id="calendar-view" hidden></div>
    <div id="bulk-overlay" class="ov-slide" hidden></div>
    <div id="review-card" hidden></div>
    <div id="review-picker" class="review-overlay ov-slide" hidden></div>
    <div id="review-show" class="review-overlay ov-slide" hidden></div>
    <div id="review-page" class="review-overlay ov-slide" hidden></div>
    <div id="poster-preview" class="review-overlay ov-slide" hidden></div>
    <div id="settings-panel" class="ov-fade" hidden>
      <div class="set-sheet ov-card">
        <div class="set-head">
          <div class="set-title">設定</div>
          <button id="settings-close" class="x-btn" type="button" aria-label="閉じる"><i class="ph ph-x"></i></button>
        </div>

        <button id="review-btn" class="set-hero" type="button">
          <span class="set-hero-icon"><i class="ph ph-sparkle"></i></span>
          <span class="set-hero-text">
            <span class="set-hero-title">ふりかえり</span>
            <span class="set-hero-sub">これまでのおでかけを、まとめて見る</span>
          </span>
          <i class="ph ph-caret-right set-hero-go"></i>
        </button>

        <div class="set-group">
          <div class="set-group-label">ふたりのこと</div>
          <button id="anniv-btn" class="set-row" type="button"><i class="ph ph-heart"></i><span>記念日</span></button>
          <button id="notify-btn" class="set-row" type="button"><i class="ph ph-bell"></i><span>記念日の通知</span><span class="set-state"></span></button>
          <button id="show-invite-btn" class="set-row" type="button"><i class="ph ph-user-plus"></i><span>招待コード</span></button>
          <button id="kick-btn" class="set-row danger" type="button"><i class="ph ph-user-minus"></i><span>相手を外す</span></button>
        </div>

        <div class="set-group">
          <div class="set-group-label">地図の見た目</div>
          <button id="cluster-btn" class="set-row" type="button"><i class="ph ph-circles-three"></i><span>ピンをまとめる</span><span class="set-state"></span></button>
          <button id="genre-btn" class="set-row" type="button"><i class="ph ph-tag"></i><span>ジャンル編集</span></button>
          <button id="trip-btn" class="set-row" type="button"><i class="ph ph-suitcase-rolling"></i><span>旅行</span></button>
        </div>

        <div class="set-group">
          <div class="set-group-label">記録のデータ</div>
          <button id="export-btn" class="set-row" type="button"><i class="ph ph-download-simple"></i><span>書き出し</span></button>
          <button id="import-btn" class="set-row" type="button"><i class="ph ph-upload-simple"></i><span>読み込み</span></button>
          <input type="file" id="import-file" accept="application/json,.json" hidden>
          <button id="photo-migrate-btn" class="set-row" type="button" hidden><i class="ph ph-cloud-arrow-up"></i><span>写真を軽くする</span></button>
        </div>

        <div class="set-group">
          <button id="logout-btn" class="set-row" type="button"><i class="ph ph-sign-out"></i><span>ログアウト</span></button>
        </div>

        <!-- 中身は下のスクリプトが実際に読み込んだ版で埋める。手書きの数字は当てにしない -->
        <div class="app-ver">ver. -</div>
      </div>
    </div>
    <div id="genre-editor" class="ov-fade" hidden></div>
    <div id="trip-editor" class="ov-fade" hidden></div>
  </main>

  <script src="js/overlay.js?v=20260903g"></script>
  <script src="js/genres.js?v=20260903g"></script>
  <script src="js/trips.js?v=20260903g"></script>
  <script src="js/filters.js?v=20260903g"></script>
  <script src="js/range-cal.js?v=20260903g"></script>
  <script src="js/photo-migrate.js?v=20260903g"></script>
  <script src="js/notify.js?v=20260903g"></script>
  <script src="js/map.js?v=20260903g"></script>
  <script src="js/places.js?v=20260903g"></script>
  <script src="js/grouping.js?v=20260903g"></script>
  <script src="js/records.js?v=20260903g"></script>
  <script src="js/bulk.js?v=20260903g"></script>
  <script src="js/lightbox.js?v=20260903g"></script>
  <script src="js/sheet.js?v=20260903g"></script>
  <script src="js/calendar.js?v=20260903g"></script>
  <script src="js/backup.js?v=20260903g"></script>
  <script src="js/memories.js?v=20260903g"></script>
  <script src="js/review-stats.js?v=20260903g"></script>
  <script src="js/review-poster.js?v=20260903g"></script>
  <script src="js/review-ui.js?v=20260903g"></script>
  <script src="js/genre-edit.js?v=20260903g"></script>
  <script src="js/trip-edit.js?v=20260903g"></script>
  <script src="js/search.js?v=20260903g"></script>
  <script type="module" src="js/app.js?v=20260903g"></script>
  <script>
    // 画面に出す「ver.」は、いま実際に読み込んだ app.js の ?v= から取る。
    // ここを手書きの数字にしていたら、版を上げる置換から取り残されて、
    // 中身は新しいのに表示だけ古いという嘘をついた。数字を持つ場所は ?v= 一つに絞る。
    (function showVersion() {
      try {
        const el = document.querySelector('.app-ver');
        const s = document.querySelector('script[src*="js/app.js"]');
        if (!el || !s) return;
        const v = new URL(s.src, location.href).searchParams.get('v');
        if (v) el.textContent = 'ver. ' + v;
      } catch (_) { /* 表示だけの話。ここで転んでも下のSW登録まで道連れにしない */ }
    })();

    // オフライン対応（アプリシェル）。sw.js?v= は下の全置換で版に追従する。
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js?v=20260903g', { updateViaCache: 'none' }).catch(() => {});
      });
    }
  </script>
</body>
</html>
