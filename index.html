<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>あしあと</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#b5675f">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20260819s">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="あしあと">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">

  <script>
    (g=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.${c}apis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})({
      key: "AIzaSyC0686dd3grl_KMmLDwTAx1UHomoLgMhDo",
      v: "weekly",
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
</head>
<body>
  <div id="splash">
    <div class="splash-inner">
      <img class="splash-logo" src="icon-512.png?v=20260819s" alt="あしあと">
      <h1 class="splash-title">あしあと</h1>
      <p class="splash-tag">あなたの足あとを、地図に。</p>
      <div class="splash-spinner"></div>
    </div>
  </div>

  <div id="gate" hidden>
    <div class="gate-card">
      <img class="gate-logo" src="icon-512.png?v=20260819s" alt="あしあと">
      <h1 class="gate-title">あしあと</h1>
      <div id="gate-login" hidden>
        <p class="gate-lead">行った場所を残して、いつでもたどれる</p>
        <button id="gate-google" class="gate-btn google"><i class="ph ph-google-logo"></i>Googleでログイン</button>
        <p class="gate-note">ログインすると、二人だけのスペースで記録を共有できます</p>
      </div>
      <div id="gate-space" hidden>
        <p class="gate-lead">スペースを作るか、招待コードで参加してください</p>
        <button id="gate-create" class="gate-btn primary">新しくスペースを作る</button>
        <div class="gate-or">または</div>
        <div class="gate-join">
          <input id="gate-code" type="text" placeholder="招待コード（例 ABCD-2345）">
          <button id="gate-join-btn" class="gate-btn">参加する</button>
        </div>
        <p id="gate-msg" class="gate-msg"></p>
      </div>
      <div id="gate-invite" hidden>
        <p class="gate-lead">スペースを作成しました。相手にこのコードを渡してください：</p>
        <div id="gate-invite-code" class="gate-code"></div>
        <button id="gate-start" class="gate-btn primary">はじめる</button>
      </div>
      <div id="gate-offline" hidden>
        <p class="gate-lead">オフラインです</p>
        <p class="gate-note">接続すると、これまでの記録が表示されます。</p>
        <button id="gate-retry" class="gate-btn primary">再読み込み</button>
      </div>
    </div>
  </div>

  <header id="topbar">
    <div id="view-toggle">
      <button id="view-map" class="active"><i class="ph ph-map-trifold"></i><span>地図</span></button>
      <button id="view-calendar"><i class="ph ph-calendar-blank"></i><span>カレンダー</span></button>
    </div>
    <button id="filter-clear-top" type="button" hidden aria-label="絞り込みをリセット"><i class="ph ph-x"></i></button>
    <div id="search-wrap">
      <i class="ph ph-magnifying-glass"></i>
      <input id="search-box" type="search" placeholder="場所名・#タグ で検索" autocomplete="off">
      <button id="search-clear" type="button" hidden aria-label="検索をクリア"><i class="ph ph-x"></i></button>
      <span class="search-div"></span>
      <button id="filter-toggle" type="button" title="絞り込み" aria-label="絞り込み"><i class="ph ph-sliders-horizontal"></i></button>
      <div id="search-suggest" hidden></div>
    </div>
    <div id="filter-panel">
      <div class="filter-title"><i class="ph ph-sliders-horizontal"></i>絞り込み</div>
      <div id="filter-bar">
        <select id="mode-select">
          <option value="all">全部</option>
          <option value="day">特定の日</option>
          <option value="range">期間</option>
        </select>
        <div id="mode-segment"><!-- セグメントをJSで生成 --></div>
        <input type="date" id="day-input" hidden>
        <span id="range-inputs" hidden>
          <input type="date" id="from-input"> 〜 <input type="date" id="to-input">
        </span>
        <div class="gf-label">ジャンル</div>
        <span id="genre-filters"><!-- チップをJSで生成 --></span>
        <button id="filter-clear" title="絞り込みをリセット"><i class="ph ph-arrow-counter-clockwise"></i>リセット</button>
      </div>
      <div class="settings-section">
        <div class="settings-label">設定</div>
        <div id="backup-bar">
          <button id="export-btn"><i class="ph ph-download-simple"></i><span>書き出し</span></button>
          <button id="show-invite-btn"><i class="ph ph-user-plus"></i><span>招待コード</span></button>
          <button id="anniv-btn"><i class="ph ph-heart"></i><span>記念日</span></button>
          <button id="review-btn"><i class="ph ph-sparkle"></i><span>ふりかえり</span></button>
          <button id="logout-btn"><i class="ph ph-sign-out"></i><span>ログアウト</span></button>
        </div>
        <div class="app-ver">ver. 20260819s</div>
      </div>
    </div>
  </header>

  <main id="layout">
    <div id="map"></div>
    <div id="map-loading" hidden><span class="ml-spinner"></span>読み込み中…</div>
    <button id="locate-btn" title="現在地で記録を追加"><i class="ph ph-crosshair"></i><span>現在地</span></button>
    <button id="bulk-btn" title="写真からまとめて追加"><i class="ph ph-images"></i><span>まとめて</span></button>
    <button id="research-btn" hidden><i class="ph ph-arrows-clockwise"></i>このエリアを再検索</button>
    <div id="memory-card" hidden></div>
    <aside id="panel" hidden>
      <button id="sheet-close" aria-label="閉じる"><i class="ph ph-x"></i></button>
      <div id="sheet-grip"><span class="sheet-handle"></span></div>
      <div id="panel-content"><p class="hint">地図を長押しして記録を追加</p></div>
    </aside>
    <div id="calendar-view" hidden></div>
    <div id="bulk-overlay" hidden></div>
    <div id="review-card" hidden></div>
    <div id="review-picker" class="review-overlay" hidden></div>
    <div id="review-show" class="review-overlay" hidden></div>
    <div id="review-page" class="review-overlay" hidden></div>
  </main>

  <script src="js/genres.js?v=20260819s"></script>
  <script src="js/filters.js?v=20260819s"></script>
  <script src="js/map.js?v=20260819s"></script>
  <script src="js/places.js?v=20260819s"></script>
  <script src="js/grouping.js?v=20260819s"></script>
  <script src="js/records.js?v=20260819s"></script>
  <script src="js/bulk.js?v=20260819s"></script>
  <script src="js/lightbox.js?v=20260819s"></script>
  <script src="js/sheet.js?v=20260819s"></script>
  <script src="js/calendar.js?v=20260819s"></script>
  <script src="js/backup.js?v=20260819s"></script>
  <script src="js/memories.js?v=20260819s"></script>
  <script src="js/review-stats.js?v=20260819s"></script>
  <script src="js/review-ui.js?v=20260819s"></script>
  <script src="js/search.js?v=20260819s"></script>
  <script type="module" src="js/app.js?v=20260819s"></script>
  <script>
    // オフライン対応（アプリシェル）。sw.js?v= は下の全置換で版に追従する。
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js?v=20260819s', { updateViaCache: 'none' }).catch(() => {});
      });
    }
  </script>
</body>
</html>
