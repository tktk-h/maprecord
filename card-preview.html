<script>
window.App = {
  genres: { list: [ {key:'food',label:'ごはん'}, {key:'cafe',label:'カフェ'}, {key:'play',label:'あそび'} ] },
  grouping: { dateOf: () => '2026-09-02' },

};

<script>document.write('<scr'+'ipt src="js/bulk.js?t='+Date.now()+'"></scr'+'ipt>')</script>
<script>
  const PH = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" fill="%23cfc3b2"/></svg>');
  const photo = (t) => ({ file:null, time:t, gps:null, url:PH });
  const base = () => ({
    photos:[photo(Date.parse('2026-09-02T14:55')),photo(Date.parse('2026-09-02T14:56')),photo(Date.parse('2026-09-02T14:56'))],
    date:'2026-09-02', center:{lat:35,lng:136}, hasGps:true, placeId:null, place:null, manualLoc:null,
    name:'', genre:'food', candidates:[], aiState:'idle', aiPickId:null, collapsed:false, memo:'', userPicked:false,
  });
  const cands = [
    {placeId:'p1',name:'犬山丸の内緑地',lat:35,lng:136},
    {placeId:'p2',name:'犬山丸の内緑地公衆トイレ',lat:35,lng:136},
    {placeId:'p3',name:'名古屋市上下水道局 犬山取水場',lat:35,lng:136},
    {placeId:'p4',name:'犬山城第１駐車場（キャッスルパーキング西面）',lat:35,lng:136},
    {placeId:'p5',name:'犬山頭首工管理所',lat:35,lng:136},
    {placeId:'p6',name:'犬山市武道館',lat:35,lng:136},
  ];
  const cases = [
    ['候補が出そろった状態（未入力）', Object.assign(base(), {candidates:cands, aiState:'done', aiPickId:'p1'})],
    ['店を選んだあと', Object.assign(base(), {candidates:cands, aiState:'done', aiPickId:'p1', placeId:'p1', name:'犬山丸の内緑地', userPicked:true, memo:'ぶらんこ。よく晴れてた。'})],
    ['AI判定中', Object.assign(base(), {aiState:'loading'})],
    ['AI未実行', base()],
    ['畳んだ状態', Object.assign(base(), {collapsed:true})],
  ];
  const wrap = document.getElementById('wrap');
  wrap.innerHTML = cases.map(([label,g],k)=>`<h3>${label}</h3><div id="bulk-list">${App.bulk._cardHtml(g,k)}</div>`).join('');
</script>
